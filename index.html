<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Sapori del Natale</title><style>body{margin:0;background:#f8f3e6;color:#174335;font:17px system-ui}main{max-width:500px;margin:auto;padding:20px}header,section{padding:22px;border-radius:20px;margin-bottom:16px;background:white;box-shadow:0 4px 15px #0001}header{text-align:center;background:#174335;color:white}h1{font-size:25px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin:5px 0;border-radius:12px}input{border:1px solid #aaa}button{background:#176044;color:white;border:0;font-weight:bold}button.alt{background:#e6ede5;color:#174335}button:disabled{opacity:.5}#status{text-align:center;font-size:23px;font-weight:bold}#status.ready{background:#176044;color:white}#num{font-size:55px}#err{color:#a20d22}a{color:#174335;overflow-wrap:anywhere}small{display:block;color:#667}article{border-top:1px solid #ddd;padding:12px 0}</style><main><header>🎄<h1>I Sapori del Natale</h1>Cercapersone digitale · PROVA</header><section id="menu"><button id="customer">Sono un cliente</button><button id="kitchen" class="alt">Cassa / cucina</button></section><section id="client" hidden><h2>Attiva il tuo avviso</h2><input id="code" placeholder="Codice ordine di 12 caratteri" maxlength="12" autocapitalize="none"><button id="activate">Attiva suono e attendi</button><button id="test" class="alt">Prova suoneria</button><small>Lascia aperta la pagina e alza il volume multimediale.</small></section><section id="status" hidden><div id="num"></div><div id="msg"></div><button id="stop" hidden class="alt">OK, arrivo! Silenzia</button></section><section id="staff" hidden><h2>Nuovo ordine</h2><input id="order" placeholder="Numero ordine" maxlength="12"><button id="create">Registra ordine</button><div id="share"></div><h2>Ordini attivi</h2><div id="orders"></div><small>Usa sempre lo stesso browser per gestire gli ordini. Validità 24 ore.</small></section><p id="err" role="alert"></p><a href="./">Torna alla scelta iniziale</a></main><script>
const $=id=>document.getElementById(id),base='https://abirdcvqkfpvwcvikotl.supabase.co/rest/v1/pager_test',api='sb_publishable_es6zpSHpugWJtntoApyqmg_m8mX_34s',fields='select=code,order_no,status,created_at';let owner=localStorage.getItem('pager-owner')||crypto.randomUUID();localStorage.setItem('pager-owner',owner);let ac,timer,ring,wake,active='',last='',muted=false;
async function req(key,method='GET',query=fields,body){let r=await fetch(base+'?'+query,{method,headers:{apikey:api,'x-pager-key':key,'Content-Type':'application/json',Prefer:'return=minimal'},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error('Operazione non riuscita ('+r.status+')');return method==='GET'?r.json():null}
function error(e){$('err').textContent=e.message||String(e)}
async function unlock(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}
function beep(){if(!ac||ac.state!=='running')return;for(let i=0;i<3;i++){let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.25;o.frequency.value=i===1?660:880;g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)}if(navigator.vibrate)navigator.vibrate([200,100,200])}
function silence(){clearInterval(ring);ring=null;muted=true;if(navigator.vibrate)navigator.vibrate(0)}
function show(which){$('menu').hidden=true;$(which).hidden=false}
$('customer').onclick=()=>show('client');$('kitchen').onclick=()=>{show('staff');refresh();setInterval(refresh,4000)};
$('test').onclick=async()=>{try{await unlock();beep()}catch(e){error(e)}};
$('activate').onclick=async()=>{try{await unlock();let code=$('code').value.trim().toLowerCase();if(!/^[a-f0-9]{12}$/.test(code))throw Error('Inserisci il codice di 12 caratteri.');let rows=await req(code);if(!rows.length)throw Error('Ordine non trovato o scaduto.');silence();active=code;last='';muted=false;clearInterval(timer);$('status').hidden=false;$('err').textContent='';if(navigator.wakeLock)try{wake=await navigator.wakeLock.request('screen')}catch{}await check();timer=setInterval(check,2500)}catch(e){error(e)}};
async function check(){try{let rows=await req(active);if(!rows.length){silence();$('msg').textContent='Ordine scaduto';clearInterval(timer);return}let r=rows[0];$('num').textContent=r.order_no;$('status').className=r.status==='ready'?'ready':'';$('msg').textContent=r.status==='ready'?(muted?'✅ Avviso silenziato. Vieni al banco.':'🔔 ORDINE PRONTO! Vieni al banco'):r.status==='collected'?'✅ Ordine ritirato':'⏳ In preparazione';$('stop').hidden=r.status!=='ready'||muted;if(r.status==='ready'&&last!=='ready'&&!muted){beep();ring=setInterval(beep,2200)}if(r.status==='collected'){silence();clearInterval(timer);if(wake)wake.release()}last=r.status;$('err').textContent=''}catch(e){error(e)}}
$('stop').onclick=()=>{silence();$('stop').hidden=true;$('msg').textContent='✅ Avviso silenziato. Vieni al banco.'};
function link(code){let u=new URL('./',location.href);u.searchParams.set('code',code);return u.href}
function share(r){let p=$('share');p.replaceChildren();let label=document.createElement('strong');label.textContent='Codice cliente: '+r.code;p.append(label,document.createElement('br'));let a=document.createElement('a');a.href=link(r.code);a.textContent='Apri link cliente';p.append(a);let b=document.createElement('button');b.className='alt';b.textContent='Condividi link cliente';b.onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Il tuo ordine',url:link(r.code)});else{await navigator.clipboard.writeText(link(r.code));b.textContent='Link copiato'}}catch(e){error(e)}};p.append(b)}
$('create').onclick=async()=>{let b=$('create');b.disabled=true;try{let n=$('order').value.trim();if(!n)throw Error('Inserisci il numero ordine');let code=crypto.randomUUID().replaceAll('-','').slice(0,12);await req(owner,'POST','',{code,owner_key:owner,order_no:n});share({code});$('order').value='';await refresh()}catch(e){error(e)}finally{b.disabled=false}};
async function refresh(){try{let rows=await req(owner,'GET',fields+'&order=created_at.desc');let root=$('orders');root.replaceChildren();for(let r of rows){if(r.status==='collected')continue;let d=document.createElement('article');let t=document.createElement('strong');t.textContent='Ordine '+r.order_no+' · '+(r.status==='ready'?'PRONTO':'In preparazione');d.append(t);let b=document.createElement('button');b.textContent=r.status==='ready'?'Segna ritirato':'🔔 Avvisa cliente';b.onclick=async()=>{b.disabled=true;try{await req(owner,'PATCH','code=eq.'+r.code,{status:r.status==='ready'?'collected':'ready'});await refresh()}catch(e){error(e);b.disabled=false}};let s=document.createElement('button');s.className='alt';s.textContent='Mostra codice cliente';s.onclick=()=>share(r);d.append(b,s);root.append(d)}$('err').textContent=''}catch(e){error(e)}}
let c=new URLSearchParams(location.search).get('code');if(c){show('client');$('code').value=c}
</script></html>
