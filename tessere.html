<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Sapori del Natale · 20 tessere</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3e6;color:#174335;font:17px system-ui}main{max-width:800px;margin:auto;padding:16px}header,section{background:white;border-radius:16px;padding:18px;margin-bottom:16px}header{text-align:center;background:#174335;color:white}h1{font-size:26px}button,input{font:inherit;padding:12px;border:1px solid #aaa;border-radius:10px;margin:4px 0;width:100%}button{border:0;background:#176044;color:white;font-weight:bold}button:disabled{opacity:.5}.alt{background:#e2ebe4;color:#174335}.danger{background:#9f3030}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;margin:0}.tile.chosen{outline:4px solid #efc34b;outline-offset:2px}.tile strong{font-size:29px;line-height:1}.tile span{font-size:11px;font-weight:800}.free{background:#176044!important;color:white!important}#feedback{min-height:42px;text-align:center;font-weight:bold}.free{background:#e0eee3;color:#174335}.waiting{background:#b97014}.ready{background:#a93131}.selected{text-align:center;scroll-margin-top:12px;border:3px solid #efc34b}#action{min-height:64px}#back{min-height:48px}#detailnum{font-size:50px;font-weight:900}#err{color:#a93131}#printsheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#printsheet[hidden]{display:none}.ticket svg{display:block;width:32mm;height:32mm;margin:5px auto;background:white}.ticket{text-align:center;border:1px dashed #777;padding:10px;break-inside:avoid}.ticket img{width:32mm;height:32mm}.ticket strong{display:block;font-size:24px}@media(max-width:420px){#cards{grid-template-columns:repeat(4,1fr)}}@media print{main>*{display:none!important}main>#printsheet{display:grid!important;grid-template-columns:repeat(3,1fr);gap:3mm;background:white;color:black;margin:0;padding:0}body{background:white}main{padding:0;max-width:none}.ticket{min-height:57mm}.ticket svg{width:32mm!important;height:32mm!important}}#scanner[hidden]{display:none}#scanner{position:fixed;inset:0;z-index:999;margin:0;padding:16px;background:#102a22;color:white;border-radius:0;display:flex;align-items:center;justify-content:center;overflow:auto}.scanpanel{width:min(100%,540px);text-align:center}.scanview{position:relative;width:100%;height:min(54vh,440px);background:#071510;border-radius:16px;overflow:hidden}#video{display:block;width:100%;height:100%;object-fit:cover}.scanframe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70%,240px);aspect-ratio:1;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px #0004;pointer-events:none}#cancelScan{margin-top:18px;min-height:54px}body.scanning{overflow:hidden}@media print{#scanner{display:none!important}}</style><main><header><h1>🎄 I Sapori del Natale</h1>20 tessere riutilizzabili · v5</header><section id="login" hidden><h2>Accesso gestore</h2><input id="secret" type="password" placeholder="Chiave gestore" autocomplete="off"><button id="signin">Accedi</button></section><section id="staff" hidden><h2>Tessere</h2><p id="summary"></p><p id="feedback" role="status">Tocca una tessera: ATTIVA → AVVISA → CONSEGNA</p><button id="scan" style="margin-bottom:12px">📷 Inquadra tessera</button><div id="cards"></div><button class="alt" id="preview">Mostra i 20 QR Code</button><button class="alt" id="print">🖨 Stampa tutte le 20 tessere</button><small>Se la fotocamera non è supportata, usa la fotocamera normale del telefono o premi il numero della tessera.</small><button class="alt" id="logout">Esci da gestore</button></section><section id="scanner" hidden aria-label="Scansione QR"><div class="scanpanel"><h2>Inquadra il QR Code</h2><p id="scanstatus" role="status">Avvio fotocamera…</p><div class="scanview"><video id="video" playsinline muted autoplay></video><div class="scanframe" aria-hidden="true"></div></div><button id="cancelScan" class="alt">ANNULLA · Torna al calendario</button></div></section><section id="detail" class="selected" hidden><div>TESSERA</div><div id="detailnum"></div><h2 id="state"></h2><p id="question"></p><button id="action"></button><button id="repeat" class="alt" hidden>🔔 Ripeti avviso</button><button id="back" class="alt" hidden>ANNULLA · Torna al calendario</button><p id="message" role="status"></p></section><section id="printsheet" hidden></section><p id="err" role="alert"></p><a href="./tessere.html">Home tessere</a></main><script src="./qrcode.js?v=2"></script><script>
const $=x=>document.getElementById(x),base='https://abirdcvqkfpvwcvikotl.supabase.co/functions/v1/',api='sb_publishable_es6zpSHpugWJtntoApyqmg_m8mX_34s';let secret=localStorage.getItem('pager-card-secret')||'',cards=[],selected=null,token=new URLSearchParams(location.search).get('card'),stream,scanTimer,busy=false;
async function call(fn,body){let r=await fetch(base+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:api},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||j.reason||'Servizio non disponibile');return j}const cardCall=b=>call('pager-cards',b);function err(e){$('err').textContent=e.message||String(e)}function url(t){let u=new URL('tessere.html',location.href);u.searchParams.set('card',t);return u.href}function num(n){return String(n).padStart(2,'0')}
async function load(){try{let r=await cardCall({action:'list',secret});cards=r.cards;$('staff').hidden=false;$('login').hidden=true;$('summary').textContent=cards.filter(c=>c.status==='free').length+' libere · '+cards.filter(c=>c.status==='waiting').length+' in preparazione · '+cards.filter(c=>c.status==='ready').length+' pronte';$('cards').replaceChildren();for(let c of cards){let b=document.createElement('button');b.className='tile '+c.status;let n=document.createElement('strong');n.textContent=num(c.number);let l=document.createElement('span');l.textContent=c.status==='free'?'ATTIVA':c.status==='waiting'?'🔔 AVVISA':'✓ CONSEGNA';b.append(n,l);b.disabled=busy;b.dataset.token=c.token;b.classList.toggle('chosen',selected?.token===c.token);b.onclick=()=>selectCard(c);$('cards').append(b)}if(token){let c=cards.find(c=>c.token===token);token=null;if(c){history.replaceState(null,'','tessere.html');selectCard(c)}}else if(selected){let c=cards.find(c=>c.token===selected.token);if(!c||c.code!==selected.code||c.status!==selected.status){selected=null;$('detail').hidden=true;$('feedback').textContent='Lo stato della tessera è cambiato. Selezionala nuovamente.';returnToCalendar()}}$('err').textContent=''}catch(e){err(e);$('login').hidden=false;$('staff').hidden=true}}
function returnToCalendar(){document.querySelectorAll('.tile').forEach(b=>b.classList.remove('chosen'));$('staff').scrollIntoView({behavior:'smooth',block:'start'})}function selectCard(c){if(busy)return;show(c);document.querySelectorAll('.tile').forEach(b=>b.classList.toggle('chosen',b.dataset.token===c.token));$('detail').scrollIntoView({behavior:'smooth',block:'start'})}function show(c){selected=c;$('detail').hidden=false;$('detailnum').textContent=num(c.number);$('state').textContent=c.status==='free'?'LIBERA':c.status==='waiting'?'IN PREPARAZIONE':'PRONTA';$('action').textContent=c.status==='free'?'✓ CONFERMA ATTIVAZIONE':c.status==='waiting'?'🔔 CONFERMA CHIAMATA':'✓ CONFERMA CONSEGNA';$('question').textContent=c.status==='free'?'Confermi di attivare la tessera '+num(c.number)+'?':c.status==='waiting'?'Confermi di avvisare il cliente della tessera '+num(c.number)+'?':'Confermi di aver consegnato il cibo e ritirato la tessera '+num(c.number)+'?';$('action').className=c.status==='ready'?'danger':'';$('repeat').hidden=c.status!=='ready';$('back').hidden=false}
async function notify(code){let r=await call('pager-push',{action:'notify',code,owner:secret});$('message').textContent=r.sent?'✅ Avviso accettato dal servizio push':'⚠️ '+r.reason;$('feedback').textContent=$('message').textContent}
async function perform(c){if(busy||!c)return;let action=c.status==='free'?'activate':c.status==='waiting'?'ready':'deliver';let completed=false;busy=true;$('back').disabled=true;$('repeat').disabled=true;document.querySelectorAll('.tile').forEach(b=>b.disabled=true);$('action').disabled=true;try{let r=await cardCall({action,secret,token:c.token,expected:c.code});completed=true;selected=null;$('detail').hidden=true;$('feedback').textContent='Tessera '+num(c.number)+': '+(action==='activate'?'attivata, consegnala al cliente':action==='deliver'?'consegnata, nuovamente libera':'ordine pronto, invio avviso…');if(action==='ready')try{await notify(r.code)}catch(e){$('feedback').textContent='Tessera '+num(c.number)+': pronta, avviso non confermato — '+e.message}}catch(e){err(e);$('feedback').textContent=e.message}finally{busy=false;$('action').disabled=false;$('back').disabled=false;$('repeat').disabled=false;await load();if(completed)returnToCalendar()}}$('action').onclick=()=>perform(selected);
$('repeat').onclick=async()=>{if(busy||!selected||selected.status!=='ready')return;busy=true;$('repeat').disabled=true;try{await notify(selected.code);selected=null;$('detail').hidden=true;await load();returnToCalendar()}catch(e){err(e)}finally{busy=false;$('repeat').disabled=false;await load()}};$('back').onclick=()=>{selected=null;token=null;$('detail').hidden=true;history.replaceState(null,'','tessere.html');returnToCalendar()};
$('signin').onclick=async()=>{secret=$('secret').value.trim();localStorage.setItem('pager-card-secret',secret);await load()};$('logout').onclick=()=>{localStorage.removeItem('pager-card-secret');location.href='tessere.html'};
function renderTickets(){if(cards.length!==20)throw Error('Attendi il caricamento delle 20 tessere');let p=$('printsheet');p.replaceChildren();for(let c of cards){let t=document.createElement('div');t.className='ticket';let brand=document.createElement('div');brand.textContent='I Sapori del Natale';let n=document.createElement('strong');n.textContent=num(c.number);let q=qrcode(0,'M');q.addData(url(c.token));q.make();let size=q.getModuleCount(),ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+(size+8)+' '+(size+8));svg.setAttribute('shape-rendering','crispEdges');let bg=document.createElementNS(ns,'rect');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill','white');svg.append(bg);let path=document.createElementNS(ns,'path'),d='';for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(q.isDark(y,x))d+='M'+(x+4)+' '+(y+4)+'h1v1h-1z';path.setAttribute('d',d);path.setAttribute('fill','black');svg.append(path);let hint=document.createElement('div');hint.textContent='Inquadra e restituisci al ritiro';t.append(brand,n,svg,hint);p.append(t)}p.hidden=false;}$('preview').onclick=()=>{try{renderTickets();$('printsheet').scrollIntoView({behavior:'smooth'})}catch(e){err(e)}};$('print').onclick=()=>{try{renderTickets();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}catch(e){err(e)}};
let scanGeneration=0,detecting=false;function stopScan(){scanGeneration++;clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('scanner').hidden=true;document.body.classList.remove('scanning');detecting=false} $('cancelScan').onclick=()=>{stopScan();returnToCalendar()};$('scan').onclick=async()=>{if(busy)return;stopScan();let generation=scanGeneration;$('scanner').hidden=false;document.body.classList.add('scanning');$('scanstatus').textContent='Avvio fotocamera…';try{if(!('BarcodeDetector'in window))throw Error('Lettura QR non supportata da questo browser. Usa la fotocamera normale del telefono o seleziona la casella nel calendario.');let d=new BarcodeDetector({formats:['qr_code']});let camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(generation!==scanGeneration){camera.getTracks().forEach(t=>t.stop());return}stream=camera;$('video').srcObject=stream;await $('video').play();if(generation!==scanGeneration)return;$('scanstatus').textContent='Posiziona il QR della tessera nel riquadro';scanTimer=setInterval(async()=>{if(detecting||generation!==scanGeneration)return;detecting=true;try{let results=await d.detect($('video'));if(generation!==scanGeneration)return;for(let x of results){let u;try{u=new URL(x.rawValue)}catch{continue}if(u.origin!==location.origin||u.pathname!==new URL('tessere.html',location.href).pathname)continue;let card=cards.find(c=>c.token===u.searchParams.get('card'));if(card){stopScan();selectCard(card);break}}}catch{}finally{detecting=false}},350)}catch(e){if(generation!==scanGeneration)return;$('scanstatus').textContent=e.message||'Fotocamera non disponibile';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}};window.addEventListener('pagehide',stopScan);
async function client(){try{let r=await cardCall({action:'lookup',token});$('detail').hidden=false;$('detailnum').textContent=num(r.number);$('state').textContent=r.code?'Il tuo ordine':'Tessera non ancora attivata';$('action').textContent=r.code?'🔔 Attiva avviso':'Riprova';$('action').onclick=()=>{if(r.code){let u=new URL('./',location.href);u.searchParams.set('code',r.code);u.searchParams.set('v','6');location.href=u.href}else client()}}catch(e){err(e)}}
if(secret){load();setInterval(()=>{if(!busy)load()},8000)}else if(token){client()}else{$('login').hidden=false}
</script></html>
