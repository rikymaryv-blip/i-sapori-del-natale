<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Sapori del Natale · 20 tessere</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3e6;color:#174335;font:17px system-ui}main{max-width:800px;margin:auto;padding:16px}header,section{background:white;border-radius:16px;padding:18px;margin-bottom:16px}header{text-align:center;background:#174335;color:white}h1{font-size:26px}button,input{font:inherit;padding:12px;border:1px solid #aaa;border-radius:10px;margin:4px 0;width:100%}button{border:0;background:#176044;color:white;font-weight:bold}button:disabled{opacity:.5}.alt{background:#e2ebe4;color:#174335}.danger{background:#9f3030}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{min-height:80px}.free{background:#e0eee3;color:#174335}.waiting{background:#b97014}.ready{background:#a93131}.selected{text-align:center}#detailnum{font-size:50px;font-weight:900}#err{color:#a93131}#printsheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#printsheet[hidden]{display:none}.ticket svg{display:block;width:32mm;height:32mm;margin:5px auto;background:white}.ticket{text-align:center;border:1px dashed #777;padding:10px;break-inside:avoid}.ticket img{width:32mm;height:32mm}.ticket strong{display:block;font-size:24px}@media(max-width:420px){#cards{grid-template-columns:repeat(4,1fr)}}@media print{main>*{display:none!important}main>#printsheet{display:grid!important;grid-template-columns:repeat(3,1fr);gap:3mm;background:white;color:black;margin:0;padding:0}body{background:white}main{padding:0;max-width:none}.ticket{min-height:57mm}.ticket svg{width:32mm!important;height:32mm!important}}</style><main><header><h1>🎄 I Sapori del Natale</h1>20 tessere riutilizzabili · v2</header><section id="login" hidden><h2>Accesso gestore</h2><input id="secret" type="password" placeholder="Chiave gestore" autocomplete="off"><button id="signin">Accedi</button></section><section id="staff" hidden><h2>Tessere</h2><p id="summary"></p><div id="cards"></div><button class="alt" id="preview">Mostra i 20 QR Code</button><button class="alt" id="print">🖨 Stampa tutte le 20 tessere</button><button class="alt" id="scan">📷 Inquadra tessera</button><video id="video" hidden playsinline style="width:100%"></video><button id="cancelScan" hidden class="alt">Annulla scansione</button><small>Se la fotocamera non è supportata, usa la fotocamera normale del telefono o premi il numero della tessera.</small><button class="alt" id="logout">Esci da gestore</button></section><section id="detail" class="selected" hidden><div>TESSERA</div><div id="detailnum"></div><h2 id="state"></h2><button id="action"></button><button id="repeat" class="alt" hidden>🔔 Ripeti avviso</button><button id="back" class="alt" hidden>Torna alle tessere</button><p id="message" role="status"></p></section><section id="printsheet" hidden></section><p id="err" role="alert"></p><a href="./tessere.html">Home tessere</a></main><script src="./qrcode.js?v=2"></script><script>
const $=x=>document.getElementById(x),base='https://abirdcvqkfpvwcvikotl.supabase.co/functions/v1/',api='sb_publishable_es6zpSHpugWJtntoApyqmg_m8mX_34s';let secret=localStorage.getItem('pager-card-secret')||'',cards=[],selected=null,token=new URLSearchParams(location.search).get('card'),stream,scanTimer,busy=false;
async function call(fn,body){let r=await fetch(base+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:api},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||j.reason||'Servizio non disponibile');return j}const cardCall=b=>call('pager-cards',b);function err(e){$('err').textContent=e.message||String(e)}function url(t){let u=new URL('tessere.html',location.href);u.searchParams.set('card',t);return u.href}function num(n){return String(n).padStart(2,'0')}
async function load(){try{let r=await cardCall({action:'list',secret});cards=r.cards;$('staff').hidden=false;$('login').hidden=true;$('summary').textContent=cards.filter(c=>c.status==='free').length+' libere · '+cards.filter(c=>c.status==='waiting').length+' in preparazione · '+cards.filter(c=>c.status==='ready').length+' pronte';$('cards').replaceChildren();for(let c of cards){let b=document.createElement('button');b.className='tile '+c.status;b.textContent=num(c.number)+' '+(c.status==='free'?'✓':c.status==='waiting'?'⏳':'🔔');b.onclick=()=>show(c);$('cards').append(b)}if(selected){let c=cards.find(c=>c.token===selected.token);if(c)show(c)}else if(token){let c=cards.find(c=>c.token===token);if(c)show(c)}$('err').textContent=''}catch(e){err(e);$('login').hidden=false;$('staff').hidden=true}}
function show(c){selected=c;$('detail').hidden=false;$('detailnum').textContent=num(c.number);$('state').textContent=c.status==='free'?'LIBERA':c.status==='waiting'?'IN PREPARAZIONE':'PRONTA';$('action').textContent=c.status==='free'?'Attiva tessera':c.status==='waiting'?'🔔 Ordine pronto':'✅ CONSEGNATO';$('action').className=c.status==='ready'?'danger':'';$('repeat').hidden=c.status!=='ready';$('back').hidden=false}
async function notify(code){let r=await call('pager-push',{action:'notify',code,owner:secret});$('message').textContent=r.sent?'✅ Avviso accettato dal servizio push':'⚠️ '+r.reason}
$('action').onclick=async()=>{if(busy||!selected)return;let c=selected;let action=c.status==='free'?'activate':c.status==='waiting'?'ready':'deliver';if(action==='deliver'&&!confirm('Confermi consegna tessera '+num(c.number)+'?'))return;busy=true;$('action').disabled=true;try{let r=await cardCall({action,secret,token:c.token,expected:c.code});$('message').textContent=action==='activate'?'Tessera attivata: consegnala al cliente':action==='deliver'?'Tessera nuovamente libera':'Ordine pronto';if(action==='ready')try{await notify(r.code)}catch(e){$('message').textContent='⚠️ '+e.message}await load()}catch(e){err(e)}finally{busy=false;$('action').disabled=false}};
$('repeat').onclick=async()=>{if(!selected||selected.status!=='ready')return;try{await notify(selected.code)}catch(e){err(e)}};$('back').onclick=()=>{selected=null;token=null;$('detail').hidden=true;history.replaceState(null,'','tessere.html')};
$('signin').onclick=async()=>{secret=$('secret').value.trim();localStorage.setItem('pager-card-secret',secret);await load()};$('logout').onclick=()=>{localStorage.removeItem('pager-card-secret');location.href='tessere.html'};
function renderTickets(){if(cards.length!==20)throw Error('Attendi il caricamento delle 20 tessere');let p=$('printsheet');p.replaceChildren();for(let c of cards){let t=document.createElement('div');t.className='ticket';let brand=document.createElement('div');brand.textContent='I Sapori del Natale';let n=document.createElement('strong');n.textContent=num(c.number);let q=qrcode(0,'M');q.addData(url(c.token));q.make();let size=q.getModuleCount(),ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+(size+8)+' '+(size+8));svg.setAttribute('shape-rendering','crispEdges');let bg=document.createElementNS(ns,'rect');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill','white');svg.append(bg);let path=document.createElementNS(ns,'path'),d='';for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(q.isDark(y,x))d+='M'+(x+4)+' '+(y+4)+'h1v1h-1z';path.setAttribute('d',d);path.setAttribute('fill','black');svg.append(path);let hint=document.createElement('div');hint.textContent='Inquadra e restituisci al ritiro';t.append(brand,n,svg,hint);p.append(t)}p.hidden=false;}$('preview').onclick=()=>{try{renderTickets();$('printsheet').scrollIntoView({behavior:'smooth'})}catch(e){err(e)}};$('print').onclick=()=>{try{renderTickets();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}catch(e){err(e)}};
function stopScan(){clearInterval(scanTimer);if(stream)stream.getTracks().forEach(t=>t.stop());$('video').hidden=true;$('cancelScan').hidden=true}$('cancelScan').onclick=stopScan;$('scan').onclick=async()=>{try{if(!('BarcodeDetector'in window))throw Error('Usa la fotocamera normale del telefono');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;$('video').hidden=false;$('cancelScan').hidden=false;await $('video').play();let d=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{let a=await d.detect($('video'));for(let x of a){let u=new URL(x.rawValue);if(u.origin!==location.origin||u.pathname!==new URL('tessere.html',location.href).pathname)continue;let c=cards.find(c=>c.token===u.searchParams.get('card'));if(c){stopScan();show(c);break}}}catch{}},450)}catch(e){stopScan();err(e)}};
async function client(){try{let r=await cardCall({action:'lookup',token});$('detail').hidden=false;$('detailnum').textContent=num(r.number);$('state').textContent=r.code?'Il tuo ordine':'Tessera non ancora attivata';$('action').textContent=r.code?'🔔 Attiva avviso':'Riprova';$('action').onclick=()=>{if(r.code){let u=new URL('./',location.href);u.searchParams.set('code',r.code);u.searchParams.set('v','6');location.href=u.href}else client()}}catch(e){err(e)}}
if(secret){load();setInterval(()=>{if(!busy)load()},8000)}else if(token){client()}else{$('login').hidden=false}
</script></html>
